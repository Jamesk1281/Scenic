name: Scenic
options:
  bundleIdPrefix: app.scenic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Scenic:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Scenic
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Allow http to the local Flask dev server (simulator -> host).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scenic.demo
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Points the app at the dev server when run from Xcode (device or simulator).
    # Change this to a hosted https URL once the backend is deployed.
    scheme:
      environmentVariables:
        SCENIC_API: http://Jamess-MacBook-Air-24.local:5057
