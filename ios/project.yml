name: Scenic
options:
  bundleIdPrefix: app.scenic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Scenic:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Scenic
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Shown when navigation asks for location to follow the route.
        NSLocationWhenInUseUsageDescription: "Scenic uses your location to follow your route, turn by turn, while you drive."
        # Keep receiving location while backgrounded. With when-in-use
        # authorization this is allowed for navigation as long as the blue
        # status bar indicator is showing, which LocationManager opts into.
        #
        # Without it, a locked phone or an incoming call silently ends the drive:
        # steps stop advancing, arrival never fires, and — since the recorder
        # runs on the same fix stream — half the drive trace goes missing. That
        # is the difference between one test drive and two.
        UIBackgroundModes:
          - location
        # Expose Documents/ (where DriveTrace writes each drive) to Files.app and
        # to Finder over a cable. That is the whole export story for drive
        # traces: copy them off, delete the ones you don't want, no in-app UI
        # and no upload. They're a record of where you drove, so they stay on
        # the phone until you move them yourself.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Allow http to the local Flask dev server (simulator -> host). The
        # deployed backend is https, so it needs no exception of its own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The deployed backend, baked into the bundle. This has to live in
        # Info.plist rather than the scheme: a scheme environment variable only
        # exists while Xcode owns the process, so an app launched from the home
        # screen (or relaunched by iOS after being jettisoned mid-drive) would
        # otherwise fall back to localhost and fail every request.
        # RouteService still prefers SCENIC_API when it is set, for local work.
        ScenicAPIBaseURL: https://api.jameskouvlis.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scenic.demo
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # No scheme environment variables on purpose: the app reads its backend from
    # ScenicAPIBaseURL above, so a build behaves the same whether Xcode launched
    # it or the user tapped the icon. To develop against a local server, add
    # SCENIC_API to the Run action's environment in Xcode's scheme editor —
    # http://127.0.0.1:5057 in the simulator, or http://<your-mac>.local:5057
    # for a device on the same Wi-Fi.

  # Unit tests for the logic that a simulator cannot exercise and a drive can
  # only test once: where the driver is on the route, when a maneuver has been
  # passed, when the trip has actually ended, and which of two overlapping
  # reroutes wins. `NavigationModel.fetchRoute` is the seam that lets these run
  # with no backend.
  ScenicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Scenic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scenic.demo.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Scenic:
    build:
      targets:
        Scenic: all
        ScenicTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScenicTests
